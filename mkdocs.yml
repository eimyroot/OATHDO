site_name: OATHDO
site_description: Deterministic documentation governance for human + AI operated systems
repo_url: https://github.com/eimyroot/OATHDO
repo_name: eimyroot/OATHDO
edit_uri: edit/main/site-docs/
docs_dir: site-docs
site_dir: site
strict: true

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

nav:
  - Overview: index.md
  - Getting started: getting-started.md
  - Governance model: governance-model.md
  - Canonical documentation:
      - Technical constitution: https://github.com/eimyroot/OATHDO/blob/main/WORLD_CLASS_SOFTWARE_DEVOPS_OPERATING_MODE.md
      - Constitutional framework: https://github.com/eimyroot/OATHDO/blob/main/GOVERDOCS_CONSTITUTIONAL_FRAMEWORK.md
      - Product operating mode: https://github.com/eimyroot/OATHDO/blob/main/PRODUCT_DECISION_EXECUTION_OPERATING_MODE.md
      - Change gate 10/10: https://github.com/eimyroot/OATHDO/blob/main/policies/CHANGE_GATE_10_OF_10.yaml
      - Documentation index: https://github.com/eimyroot/OATHDO/blob/main/DOCUMENTATION_INDEX.md
      - Project state: https://github.com/eimyroot/OATHDO/blob/main/PROJECT_STATE.md
      - Automation governance: https://github.com/eimyroot/OATHDO/blob/main/docs/governance/GOV-DOCUMENTATION-AUTOMATION.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences

plugins:
  - search
